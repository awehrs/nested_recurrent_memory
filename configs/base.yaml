# Shared by every arm. Arm files set `extends: base.yaml` and override leaves.
# Not an arm itself: do not pass it as ARM.

model:
  vocab_size: 50257          # gpt2
  hidden_size: 768
  num_hidden_layers: 12
  num_heads: 12
  head_dim: 64
  expand_v: 1.0
  use_short_conv: true
  conv_size: 4
  hidden_ratio: 4
  hidden_act: swish
  norm_eps: 1.0e-5
  initializer_range: 0.02
  tie_word_embeddings: false
  fuse_norm: true
  fuse_swiglu: true
  fuse_cross_entropy: true
  op_chunk_size: 64
  use_triton: true

data:
  dir: data/fineweb-edu-gpt2
  seq_len: 16384

optim:
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 400
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  # 32 sequences x 16k tokens. 8 GPUs x micro_batch 1 = 8/step, so 4 accum steps.
  tokens_per_step: 524288
  micro_batch: 1

run:
  tokens: 3_200_000_000      # ~6100 steps at 524288 tokens/step
  max_steps: null            # set on the CLI to cut a run short
  compile: false
  dtype: bfloat16
  seed: 0
  log_every: 10
  val_every: 400
  val_batches: 20
  save_every: 400
  wandb_project: nested-recurrent-memory
